name: a2_stocks
description: MQ Sports ERP - offline-first enterprise resource planning system.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  connectivity_plus: ^6.0.5
  uuid: ^4.5.1
  http: ^1.6.0
  shared_preferences: ^2.5.6
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  file_picker: ^13.3.3
  url_launcher: ^6.3.3
  flutter_secure_storage: ^11.2.0
  pdf: ^3.13.1
  printing: ^5.15.1
  fl_chart: ^0.69.2
  barcode_widget: ^2.0.4
  image: ^4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/a2stocks_logo.png
    - assets/images/a2stocks_mark.png
  fonts:
    # Inter (SIL Open Font License, see assets/fonts/Inter-LICENSE.txt).
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
